<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 64" width="210" height="64" role="img" aria-label="Spydsk">
  <title>Spydsk</title>
  <defs>
    <linearGradient id="spySilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="55%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="pillStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#2c2c32"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="206" height="60" rx="14" fill="url(#pillBg)" stroke="url(#pillStroke)" stroke-width="1.5"/>

  <text x="105" y="45"
        text-anchor="middle"
        font-family="Segoe UI, Liberation Sans, Arial, Helvetica, sans-serif"
        font-size="40"
        font-weight="800"
        letter-spacing="1"><tspan fill="url(#spySilver)">Spy</tspan><tspan fill="#ffffff">dsk</tspan></text>
</svg>
