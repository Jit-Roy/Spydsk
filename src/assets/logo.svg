<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#8e8e99" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a48" />
      <stop offset="100%" stop-color="#1c1c24" />
    </linearGradient>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#272733" stroke-width="2" />

  <!-- Base Storage Disk Platter -->
  <ellipse cx="64" cy="94" rx="34" ry="12" fill="url(#ringGrad)" stroke="#454555" stroke-width="1.8" />
  <ellipse cx="64" cy="94" rx="14" ry="5" fill="#121217" stroke="#333340" stroke-width="1.2" />

  <!-- Tree Trunk / Center Data Stream -->
  <line x1="64" y1="89" x2="64" y2="52" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Branching Tree Nodes (Hierarchical Structure) -->
  <!-- Left Primary Branch -->
  <path d="M64 68 C 50 68, 38 58, 38 46" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Right Primary Branch -->
  <path d="M64 68 C 78 68, 90 58, 90 46" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Secondary Branches -->
  <path d="M38 46 C 38 38, 30 32, 28 26" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" />
  <path d="M38 46 C 38 38, 48 34, 48 26" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" />
  <path d="M90 46 C 90 38, 80 34, 80 26" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" />
  <path d="M90 46 C 90 38, 98 32, 100 26" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" />

  <!-- Storage Node Orbs -->
  <!-- Root Node -->
  <circle cx="64" cy="38" r="5" fill="#ffffff" />
  <circle cx="64" cy="38" r="8" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />

  <!-- Mid Nodes -->
  <circle cx="38" cy="46" r="4.2" fill="#e4e4e7" />
  <circle cx="90" cy="46" r="4.2" fill="#e4e4e7" />

  <!-- Leaf Nodes -->
  <circle cx="28" cy="26" r="3" fill="#a1a1aa" />
  <circle cx="48" cy="26" r="3" fill="#a1a1aa" />
  <circle cx="80" cy="26" r="3" fill="#a1a1aa" />
  <circle cx="100" cy="26" r="3" fill="#a1a1aa" />
</svg>
