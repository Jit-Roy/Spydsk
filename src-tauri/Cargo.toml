[package]
name = "disklens"
version = "0.1.0"
description = "DiskLens - Modern High-Performance Disk Space Analyzer"
authors = ["you"]
edition = "2021"
default-run = "disklens"

[[bin]]
name = "disklens"
path = "src/main.rs"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
walkdir = "2.5"
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
